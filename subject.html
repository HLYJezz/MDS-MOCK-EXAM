<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papers · MDS Mock Exam</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=1.5">
<link rel="stylesheet" href="assets/css/style.css?v=1.5">
<script>
/* Set the theme before first paint so dark-mode users never see a white flash. */
(function () {
  var t; try { t = JSON.parse(localStorage.getItem('mds-mock:theme')); } catch (e) {}
  if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/img/medrsu-logo@64.png?v=1.5"
           srcset="assets/img/medrsu-logo@64.png 1x, assets/img/medrsu-logo.png 2x"
           alt="" width="45" height="64">
      <span class="brand-text">
        <span class="brand-name">Mock Exam</span>
        <span class="brand-sub">MEDRSU</span>
      </span>
    </a>
    <button id="themeToggle" class="ghost-btn" type="button" title="Toggle theme">◐</button>
  </div>
</header>

<div class="course-banner" id="courseBanner">
  <div class="wrap">
    <nav class="crumb">
      <a href="index.html">← All subjects</a>
    </nav>
    <section class="hero course-hero">
      <span class="course-hero-icon" id="courseIcon" aria-hidden="true"></span>
      <div>
        <h1 id="courseTitle">—</h1>
        <p class="lede" id="courseSummary"></p>
      </div>
    </section>
  </div>
</div>

<main class="wrap">
  <section id="paperGrid" class="subject-grid" aria-live="polite">
    <p class="muted">Loading papers…</p>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <img src="assets/img/medrsu-logo@64.png?v=1.5"
           srcset="assets/img/medrsu-logo@64.png 1x, assets/img/medrsu-logo.png 2x"
           alt="DMS-MD-RSU" width="45" height="64">
      <p class="muted small">Practice papers only. Scores are stored on this device and are not sent anywhere.<span id="privacyNote"></span><br>
        An unofficial study site made by a student — not published by the college.</p>
    </div>
    <p class="credit small">Made by <strong>VICHAKARN37</strong>
      <a class="credit-link" href="credit.html" title="Credits" aria-label="Credits">
        <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round">
          <circle cx="10" cy="10" r="7.6"/><path d="M10 9v4.6"/><path d="M10 6.4v.1"/>
        </svg>
      </a></p>
  </div>
</footer>

<script src="assets/js/store.js?v=1.5"></script>
<script src="assets/js/theme.js?v=1.5"></script>
<script src="assets/js/registry.js?v=1.5"></script>
<script src="assets/js/loader.js?v=1.5"></script>
<script src="assets/js/icons.js?v=1.5"></script>
<script src="data/manifest.js?v=1.5"></script>
<script src="assets/js/feedback.js?v=1.5"></script>
<script src="assets/js/modal.js?v=1.5"></script>
<script src="assets/js/subject.js?v=1.5"></script>
<script src="assets/js/analytics.js?v=1.5"></script>
</body>
</html>
