<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papers · MDS Mock Exam</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<script>
/* Set the theme before first paint so dark-mode users never see a white flash. */
(function () {
  var t; try { t = JSON.parse(localStorage.getItem('mds-mock:theme')); } catch (e) {}
  if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">MDS</span>
      <span class="brand-text">Mock Exam</span>
    </a>
    <button id="themeToggle" class="ghost-btn" type="button" title="Toggle theme">◐</button>
  </div>
</header>

<div class="course-banner" id="courseBanner">
  <div class="wrap">
    <nav class="crumb">
      <a href="index.html">← All subjects</a>
    </nav>
    <section class="hero course-hero">
      <span class="course-hero-icon" id="courseIcon" aria-hidden="true"></span>
      <div>
        <h1 id="courseTitle">—</h1>
        <p class="lede" id="courseSummary"></p>
      </div>
    </section>
  </div>
</div>

<main class="wrap">
  <section id="paperGrid" class="subject-grid" aria-live="polite">
    <p class="muted">Loading papers…</p>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="muted small">Practice papers only. Scores are stored on this device and are not sent anywhere.<span id="privacyNote"></span></p>
    <p class="credit small">Made by <strong>Day</strong> · MEDRSU37</p>
  </div>
</footer>

<script src="assets/js/store.js"></script>
<script src="assets/js/registry.js"></script>
<script src="assets/js/loader.js"></script>
<script src="data/manifest.js"></script>
<script src="assets/js/feedback.js"></script>
<script src="assets/js/subject.js"></script>
<script src="assets/js/analytics.js"></script>
</body>
</html>
