<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam · MDS Mock Exam</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>
/* Set the theme before first paint so dark-mode users never see a white flash. */
(function () {
  var t; try { t = JSON.parse(localStorage.getItem('mds-mock:theme')); } catch (e) {}
  if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body class="exam-body">

<!-- Exam chrome -->
<header class="exam-header" id="examHeader">
  <div class="exam-header-inner">
    <div class="exam-id">
      <a class="back-link" id="backLink" href="index.html" title="Back to subjects">←</a>
      <div>
        <div class="exam-title" id="examTitle">—</div>
        <div class="exam-sub muted small" id="examSub"></div>
      </div>
    </div>
    <div class="exam-tools">
      <div class="timer" id="timer" title="Time remaining">--:--</div>
      <button id="paletteToggle" class="ghost-btn small" type="button">Questions</button>
      <button id="submitBtn" class="primary-btn small" type="button">Submit</button>
    </div>
  </div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
</header>

<!-- Screen 1: instructions -->
<main id="screenIntro" class="wrap screen">
  <div class="card intro-card">
    <h1 id="introTitle">—</h1>
    <p id="introDesc" class="lede"></p>
    <ul class="fact-list" id="introFacts"></ul>

    <div class="pace hidden" id="lectureBlock">
      <div class="lecture-head">
        <h2>Which lectures</h2>
        <button id="lectureAll" class="ghost-btn small" type="button">Select all</button>
      </div>
      <div class="lecture-options" id="lectureOptions" role="group" aria-label="Lectures to include"></div>
      <p class="muted small" id="lectureSummary"></p>
    </div>

    <div class="pace">
      <h2>How you want to be marked</h2>
      <div class="mode-options" id="modeOptions" role="group" aria-label="Marking"></div>
    </div>

    <div class="pace" id="paceBlock">
      <h2>Time per question</h2>
      <div class="pace-options" id="paceOptions" role="group" aria-label="Time per question"></div>
      <p class="muted small" id="paceSummary"></p>
    </div>

    <div class="rules">
      <h2 id="rulesTitle">Exam rules</h2>
      <ul id="rulesList"></ul>
    </div>
    <div class="intro-actions">
      <button id="startBtn" class="primary-btn" type="button">Start exam</button>
      <button id="resumeBtn" class="secondary-btn hidden" type="button">Resume saved attempt</button>
      <a class="secondary-btn" id="introBack" href="index.html">Back to subjects</a>
    </div>
  </div>
</main>

<!-- Screen 2: the paper -->
<main id="screenExam" class="screen hidden">
  <div class="exam-layout">
    <section class="question-pane">
      <article class="card question-card" id="questionCard"></article>
      <nav class="question-nav">
        <button id="prevBtn" class="secondary-btn" type="button">← Previous</button>
        <button id="flagBtn" class="ghost-btn" type="button">⚑ Flag for review</button>
        <button id="confirmBtn" class="primary-btn hidden" type="button">Confirm answer</button>
        <button id="nextBtn" class="primary-btn" type="button">Next →</button>
      </nav>
    </section>
    <aside class="palette" id="palette">
      <h2 class="palette-title">Question navigator</h2>
      <div class="palette-grid" id="paletteGrid"></div>
      <ul class="legend">
        <li><span class="dot answered"></span> Answered</li>
        <li><span class="dot flagged"></span> Flagged</li>
        <li><span class="dot"></span> Not answered</li>
      </ul>
      <div class="palette-summary muted small" id="paletteSummary"></div>
    </aside>
  </div>
</main>

<!-- Screen 3: results -->
<main id="screenResult" class="wrap screen hidden">
  <div class="card result-card" id="resultCard"></div>
  <section id="reviewList" class="review-list"></section>
</main>

<!-- Confirm dialog -->
<div class="modal hidden" id="modal">
  <div class="modal-box card">
    <h2 id="modalTitle">Submit paper?</h2>
    <p id="modalBody" class="muted"></p>
    <div class="modal-actions">
      <button id="modalCancel" class="secondary-btn" type="button">Keep working</button>
      <button id="modalConfirm" class="primary-btn" type="button">Submit now</button>
    </div>
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/registry.js"></script>
<script src="assets/js/loader.js"></script>
<script src="assets/js/icons.js"></script>
<script src="data/manifest.js"></script>
<script src="assets/js/feedback.js"></script>
<script src="assets/js/modal.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/companion.js"></script>
<script src="assets/js/exam.js"></script>
<script src="assets/js/analytics.js"></script>
</body>
</html>
